name: Daily Tech Digest

on:
  schedule:
    # Runs hourly to process dynamic daily sync schedule
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Scraper Engine
        run: python scraper.py

      - name: Sync Updates
        run: |
          git config --global user.name "RMNO21"
          git config --global user.email "tondroraman83@gmail.com"
          git add archive/ README.md
          if git diff-index --quiet HEAD --; then
            echo "Working tree clean. No sync required for this cycle."
          else
            COMMIT_MSG=$(python -c "import scraper; print(scraper.get_natural_commit_message())")
            git commit -m "$COMMIT_MSG"
            git push
          fi
