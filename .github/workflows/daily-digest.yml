name: Daily Tech Digest

on:
  schedule:
    # Runs every 4 hours
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Scraper Engine
        run: python scraper.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "RMNO21"
          git config --global user.email "tondroraman83@gmail.com"
          git add archive/ README.md
          if git diff-index --quiet HEAD --; then
            echo "No new updates to commit."
          else
            git commit -m "docs: update latest news digest"
            git push
          fi
