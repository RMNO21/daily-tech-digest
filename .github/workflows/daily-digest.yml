name: Daily Tech Digest

on:
  schedule:
    # Runs every 6 hours: 00:00, 06:00, 12:00, 18:00 UTC (03:30, 09:30, 15:30, 21:30 Iran Time)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  run-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Scraper Engine
        run: python scraper.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "RMNO21"
          git config --global user.email "tondroraman83@gmail.com"
          git add archive/ README.md
          if git diff-index --quiet HEAD --; then
            echo "No new updates to commit."
          else
            git commit -m "chore(digest): update daily tech digest [$(date -u +'%Y-%m-%d')]"
            git push
          fi
